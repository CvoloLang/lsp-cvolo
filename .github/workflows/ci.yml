name: CI

on:
  push:
    branches:
      - master
      # LanguageServer development happens on develop/0.1.0, so every develop push is
      # built and tested here before a release tag is cut from it.
      - 'develop/**'
    tags: ['*']
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag matches Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v*) version_from_tag="${tag#v}" ;;
            *) echo "Release tag must start with v." >&2; exit 1 ;;
          esac
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -n 1)"
          if [ "$version_from_tag" != "$version" ]; then
            echo "Release tag version '$version_from_tag' does not match Version '$version' in Directory.Build.props." >&2
            exit 1
          fi

      # Development tests use the exact Cvolo commit that passed full CI.
      # This SHA provides Tooling 0.0.21.2 and the complete LSP event catalog.
      # CI must not build 0.0.21.1 while tooling.version pins 0.0.21.2.
      # Tagged releases and master still use immutable verified Tooling assets.
      - name: Checkout CI-pinned development Tooling source
        if: startsWith(github.ref, 'refs/heads/develop/') || startsWith(github.base_ref, 'develop/')
        uses: actions/checkout@v4
        with:
          repository: IgorShaposhnikov/Cvolo
          ref: 43f07cc3981d8254571d278a63f83c683065d708
          path: .dev-compiler
          persist-credentials: false

      - name: Build and verify development Tooling
        if: startsWith(github.ref, 'refs/heads/develop/') || startsWith(github.base_ref, 'develop/')
        shell: pwsh
        run: >
          ./build/use-development-tooling.ps1
          -CompilerSource ".dev-compiler"
          -ExpectedCommit "43f07cc3981d8254571d278a63f83c683065d708"

      - name: Fetch pinned release Tooling
        if: "!startsWith(github.ref, 'refs/heads/develop/') && !startsWith(github.base_ref, 'develop/')"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File build/fetch-tooling.ps1
          else
            bash build/fetch-tooling.sh
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test standalone diagnostic analyzer
        run: python -m unittest discover -s tools/tests -v

      - name: Validate normative Inc 3.3 87-case RTM inventory
        run: python tools/validate_inc33_normative_rtm.py

      - name: Verify fixed Inc 3.3 progress plan
        run: python tools/validate_inc33_progress.py

      # A green development build checks the RTM, not release acceptance.
      # Tagged releases require verified evidence for every normative case.
      - name: Require complete Inc 3.3 acceptance for release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/validate_inc33_normative_rtm.py --require-complete

      - name: Inc 3.3 performance smoke contract
        shell: bash
        run: |
          python tools/evaluate_inc33_perf.py --report test-evidence/performance-smoke.json
          python -c "import json; p=json.load(open('test-evidence/performance-smoke.json')); assert p['status']=='NOT_RUN' and not p['endToEndRegressionGatePassed']"

      - name: Upload Inc 3.3 performance smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inc33-perf-smoke-${{ matrix.os }}
          path: test-evidence/performance-smoke.json
          if-no-files-found: warn

      - name: Restore (locked)
        run: dotnet restore src/Cvolo.LanguageServer.slnx --locked-mode -p:ContinuousIntegrationBuild=true

      - name: Build
        run: dotnet build src/Cvolo.LanguageServer.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet run --project tests/Cvolo.LanguageServer.Tests/Cvolo.LanguageServer.Tests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
